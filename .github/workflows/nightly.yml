name: Nightly build

# Builds main once a day, but only when main has moved since the last nightly.
# Every build publishes the rolling `nightly` pre-release and a numbered `build-N` release (Latest), both with etaHEN.elf + all plugin ELFs.
on:
  push:
    branches: ['**']
  schedule:
    - cron: "0 19 * * *" # 03:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not changed since the last nightly
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/nightly.yml # build-only check when this file changes

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false # never interrupt a publish half-way

env:
  PS5_SDK_VERSION: v0.45 # https://github.com/ps5-payload-dev/sdk/releases
  PACBREW_VERSION: v0.41.1 # https://github.com/ps5-payload-dev/pacbrew-repo/releases (libcurl, openssl, zlib)
  KEYSTONE_VERSION: 0.9.2 # host unit tests only
  LLVM_VERSION: 19

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null) || last=""
          echo "HEAD:    $GITHUB_SHA"
          echo "nightly: ${last:-<none>}"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$FORCE" = true ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since the last nightly; skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # kstuff-lite only; its nested submodules are not needed

      - name: Install host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION" ninja-build cmake xz-utils unzip librsvg2-bin
          {
            echo "LLVM_CONFIG=/usr/bin/llvm-config-$LLVM_VERSION"
            echo "TOOLCHAIN_DIR=$HOME/toolchain" # outside the checkout, cached below
            echo "PS5_PAYLOAD_SDK=$HOME/toolchain/ps5-payload-sdk"
            echo "KEYSTONE_PREFIX=$HOME/toolchain/keystone"
          } >> "$GITHUB_ENV"

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/toolchain
          key: toolchain-sdk-${{ env.PS5_SDK_VERSION }}-pacbrew-${{ env.PACBREW_VERSION }}-keystone-${{ env.KEYSTONE_VERSION }}

      - name: Install PS5 payload SDK + pacbrew libs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TOOLCHAIN_DIR"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/download/$PS5_SDK_VERSION/ps5-payload-sdk.zip"
          unzip -q sdk.zip -d sdk && mv sdk/ps5-payload-sdk "$PS5_PAYLOAD_SDK"
          # etaHEN's util needs libcurl (+ openssl, zlib, ...) and the CA bundle from
          # the prebuilt pacbrew packages in target/user/homebrew. Only headers, libs
          # and etc/ are extracted; the rest of the archive is not needed.
          hb=opt/ps5-payload-sdk/target/user/homebrew
          curl -fsSL --retry 3 \
            "https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/$PACBREW_VERSION/ps5-payload-dev.tar.gz" |
            tar -xz -C "$PS5_PAYLOAD_SDK" --strip-components=2 "$hb/include" "$hb/lib" "$hb/etc"
          test -f "$PS5_PAYLOAD_SDK/target/user/homebrew/lib/libcurl.a"
          rm -rf sdk sdk.zip

      - name: Build etaHEN (Release)
        run: |
          export PATH="/usr/lib/llvm-$LLVM_VERSION/bin:$PS5_PAYLOAD_SDK/bin:$PATH"
          ./scripts/build.sh --release --jobs "$(nproc)"

      - name: Collect etaHEN.elf and the plugin ELFs
        run: |
          # Plugins are named after their plugin ID: copy them as-is into
          # /data/etaHEN/plugins/ to reinstall one without reloading etaHEN.
          mkdir -p dist
          cp build/bin/etaHEN.elf dist/etaHEN.elf
          cp build/bin/dpiv2.elf    dist/DPIV00001.elf
          cp build/bin/ftpsrv.elf   dist/FTPS00001.elf
          cp build/bin/ntp.elf      dist/NTPS00001.elf
          cp build/bin/dashplug.elf dist/DASH00001.elf
          cp build/bin/mgallery.elf dist/MGAL00001.elf
          cp build/bin/updater.elf  dist/UPDT00001.elf
          cp build/bin/neopro.elf   dist/NEOP00001.elf
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: etaHEN-nightly
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish releases
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: etaHEN-nightly

      - name: Update the nightly pre-release
        run: |
          short=${GITHUB_SHA::7}
          prev=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null) || prev=""
          stable=$(gh release view --json tagName --jq .tagName 2>/dev/null) || stable="" # latest non-prerelease
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "Automated **Release** build of \`main\` at [\`$short\`]($url/commit/$GITHUB_SHA), built $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "This is an untested development build. Use the latest stable release unless you want to try new changes early."
            echo
            if [ -n "$prev" ] && [ "$prev" != "$GITHUB_SHA" ]; then
              echo "- Changes since the previous nightly: [\`${prev::7}...$short\`]($url/compare/$prev...$GITHUB_SHA)"
            fi
            if [ -n "$stable" ]; then
              echo "- Changes since $stable: [\`$stable...$short\`]($url/compare/$stable...$GITHUB_SHA)"
            fi
            echo "- \`etaHEN.elf\` SHA-256: \`$(sha256sum etaHEN.elf | cut -d' ' -f1)\`"
            echo "- etaHEN.elf only embeds the Plugin Updater; all plugin ELFs (DPI v2, FTP, NTP, Dashboard, Media Gallery, Plugin Updater) are attached: install them with the Plugin Updater or copy one to \`/data/etaHEN/plugins/\` to reinstall it."
          } > notes.md

          if gh release view nightly >/dev/null 2>&1; then
            # Move the tag to the new commit and replace the assets in place.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            for asset in $(gh release view nightly --json assets --jq '.assets[].name'); do
              gh release delete-asset nightly "$asset" --yes
            done
            gh release edit nightly --title "Nightly build ($short)" --notes-file notes.md --prerelease
            gh release upload nightly etaHEN.elf DPIV00001.elf FTPS00001.elf NTPS00001.elf DASH00001.elf MGAL00001.elf UPDT00001.elf NEOP00001.elf
          else
            # First run (or the release was deleted): drop any stale tag, then create.
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" >/dev/null 2>&1 || true
            gh release create nightly etaHEN.elf DPIV00001.elf FTPS00001.elf NTPS00001.elf DASH00001.elf MGAL00001.elf UPDT00001.elf NEOP00001.elf --target "$GITHUB_SHA" --prerelease \
              --title "Nightly build ($short)" --notes-file notes.md
          fi

      - name: Publish a numbered release (becomes "Latest")
        run: |
          short=${GITHUB_SHA::7}
          tag="build-${GITHUB_RUN_NUMBER}"
          {
            echo "Build #${GITHUB_RUN_NUMBER} of \`main\` at [\`$short\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), built $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "- \`etaHEN.elf\` SHA-256: \`$(sha256sum etaHEN.elf | cut -d' ' -f1)\`"
            echo "- \`etaHEN.elf\` only embeds the Plugin Updater (UPDT00001). Every other plugin ELF (DPI v2, FTP, NTP, Dashboard, Media Gallery, PS4 Pro Mode) is attached here and can be installed from the Plugin Updater, or copied to \`/data/etaHEN/plugins/\`."
          } > notes_build.md
          gh release create "$tag" etaHEN.elf DPIV00001.elf FTPS00001.elf NTPS00001.elf DASH00001.elf MGAL00001.elf UPDT00001.elf NEOP00001.elf \
            --target "$GITHUB_SHA" --latest --title "etaHEN build #${GITHUB_RUN_NUMBER} ($short)" --notes-file notes_build.md
