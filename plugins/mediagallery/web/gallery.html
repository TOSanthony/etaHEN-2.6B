<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0c11">
<title>Media Gallery</title>
<style>
:root{--bg:#0a0c11;--panel:#12151d;--panel2:#181c27;--line:#232838;--txt:#eef1f8;--mut:#8a93a8;--acc:#6d8cff;--acc2:#a06dff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#16203f55,transparent),radial-gradient(900px 500px at 100% 0,#2a164a44,transparent),var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px) saturate(1.4);background:#0a0c11cc;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;box-shadow:0 4px 18px #6d8cff55}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{background:none;border:0;color:var(--mut);padding:6px 14px;border-radius:8px;font:inherit;cursor:pointer;transition:.15s}
.seg button.on{background:linear-gradient(135deg,#3a4fa8,#5b3aa8);color:#fff;box-shadow:0 2px 10px #0006}
.seg button:not(.on):hover{color:var(--txt)}
.sp{flex:1}
select,.btn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer;transition:.15s}
select:hover,.btn:hover{border-color:#3a4260;background:var(--panel2)}
.stat{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;padding:0 22px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;gap:7px;align-items:center;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;transition:.15s}
.chip b{color:var(--mut);font-weight:500}
.chip:hover{border-color:#3a4260}
.chip.on{background:linear-gradient(135deg,#3a4fa8,#5b3aa8);border-color:transparent}
.chip.on b{color:#dfe5ff}
main{padding:6px 22px 60px;max-width:1900px;margin:0 auto}
.day{margin:22px 0 10px;font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;display:flex;align-items:center;gap:12px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--panel);cursor:pointer;border:1px solid #ffffff0d;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-3px) scale(1.012);box-shadow:0 14px 34px #000a;border-color:#6d8cff66}
.card img,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.card .ld{opacity:1}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:200% 100%;animation:sh 1.4s infinite}
.card.ok::before{display:none}
@keyframes sh{to{background-position:-200% 0}}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 11px 9px;background:linear-gradient(transparent,#000c);display:flex;justify-content:space-between;align-items:flex-end;opacity:0;transform:translateY(6px);transition:.2s}
.card:hover .cap{opacity:1;transform:none}
.cap span{font-size:12px;font-weight:600}.cap small{font-size:11px;color:#c9d0e4}
.badge{position:absolute;top:9px;right:9px;background:#000a;backdrop-filter:blur(8px);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;display:flex;gap:5px;align-items:center}
.empty{padding:90px 20px;text-align:center;color:var(--mut)}
.empty h2{color:var(--txt);margin:0 0 6px}
#lb{position:fixed;inset:0;z-index:50;display:none;background:#05060bf2;backdrop-filter:blur(14px)}
#lb.on{display:flex;flex-direction:column}
#stage{flex:1;display:grid;place-items:center;min-height:0;padding:16px 70px;position:relative}
#stage img,#stage video{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 70px #000c;background:#000}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid #ffffff22;background:#ffffff12;color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(8px);transition:.15s}
.nav:hover{background:#ffffff28}.nav.l{left:14px}.nav.r{right:14px}
.lbbar{display:flex;align-items:center;gap:14px;padding:12px 22px 18px;flex-wrap:wrap}
.lbbar .meta{flex:1;min-width:200px}.lbbar .meta b{display:block;font-size:15px}.lbbar .meta span{color:var(--mut);font-size:12.5px}
.lbbar a.btn{text-decoration:none}
.x{position:absolute;top:14px;right:16px;z-index:2}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2233;border:1px solid var(--line);padding:9px 16px;border-radius:10px;z-index:60;display:none}
@media(max-width:640px){.top{padding:10px 14px}.chips,main{padding-left:14px;padding-right:14px}#stage{padding:10px}.nav{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}}
</style></head><body>
<header>
 <div class="top">
  <div class="logo"><i>&#9654;</i>Media Gallery</div>
  <div class="seg" id="seg"><button data-t="" class="on">Tout</button><button data-t="photo">Photos</button><button data-t="video">Vid&eacute;os</button></div>
  <div class="sp"></div>
  <span class="stat" id="stat"></span>
  <select id="sort"><option value="date_desc">Plus r&eacute;cent</option><option value="date_asc">Plus ancien</option><option value="size_desc">Plus lourd</option><option value="name_asc">Nom</option></select>
  <button class="btn" id="rescan" title="Re-scanner la biblioth&egrave;que">&#8635; Re-scanner</button>
 </div>
 <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<div id="lb"><button class="btn x" id="lbx">&#10005; Fermer</button>
 <div id="stage"><button class="nav l" id="lp">&#10094;</button><div id="box"></div><button class="nav r" id="ln">&#10095;</button></div>
 <div class="lbbar"><div class="meta"><b id="lt"></b><span id="ls"></span></div><a class="btn" id="ld" download>&#11015; T&eacute;l&eacute;charger</a></div></div>
<div class="toast" id="toast"></div>
<script>
const $=i=>document.getElementById(i);
let all=[],view=[],type="",game="",cur=-1;
const fmtSize=b=>b>1e9?(b/1e9).toFixed(2)+" Go":b>1e6?(b/1e6).toFixed(1)+" Mo":Math.round(b/1e3)+" Ko";
const dayKey=t=>{if(!t)return"Date inconnue";const d=new Date(t*1000),n=new Date(),s=x=>x.toDateString();
 if(s(d)===s(n))return"Aujourd'hui";const y=new Date(n-864e5);if(s(d)===s(y))return"Hier";
 return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
const when=t=>t?new Date(t*1000).toLocaleString("fr-FR",{dateStyle:"medium",timeStyle:"short"}):"";
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display="none",2500)}
async function loadAll(){
  all=[];let off=0,total=1;
  while(off<total){
    const r=await(await fetch("/api/v1/media?limit=500&offset="+off+"&sort=date_desc")).json();
    total=r.total;all=all.concat(r.items);off+=r.items.length;if(!r.items.length)break;
  }
  render();
}
function chips(){
  const base=all.filter(m=>!type||m.type===type),c={};
  base.forEach(m=>c[m.game_id||"?"]=(c[m.game_id||"?"]||0)+1);
  const ids=Object.keys(c).sort((a,b)=>c[b]-c[a]);
  let h='<div class="chip'+(game?'':' on')+'" data-g="">Tous les jeux <b>'+base.length+'</b></div>';
  ids.forEach(g=>h+='<div class="chip'+(game===g?' on':'')+'" data-g="'+g+'">'+g+' <b>'+c[g]+'</b></div>');
  $("chips").innerHTML=h;
}
function render(){
  chips();
  const s=$("sort").value;
  view=all.filter(m=>(!type||m.type===type)&&(!game||m.game_id===game));
  const cmp={date_desc:(a,b)=>b.captured_at-a.captured_at,date_asc:(a,b)=>a.captured_at-b.captured_at,size_desc:(a,b)=>b.size-a.size,name_asc:(a,b)=>a.name.localeCompare(b.name)}[s];
  view.sort(cmp);
  const ph=view.filter(m=>m.type==="photo").length,vi=view.length-ph;
  $("stat").textContent=view.length+" médias · "+ph+" photos · "+vi+" vidéos";
  const main=$("main");main.innerHTML="";
  if(!view.length){main.innerHTML='<div class="empty"><h2>Aucun média</h2>Rien à afficher avec ces filtres.</div>';return}
  const grouped=s.startsWith("date");let grid=null,last=null;
  view.forEach((m,i)=>{
    if(grouped){const k=dayKey(m.captured_at);if(k!==last){last=k;const d=document.createElement("div");d.className="day";d.textContent=k;main.appendChild(d);grid=document.createElement("div");grid.className="grid";main.appendChild(grid)}}
    else if(!grid){grid=document.createElement("div");grid.className="grid";main.appendChild(grid)}
    grid.appendChild(card(m,i));
  });
  io.disconnect();document.querySelectorAll(".card").forEach(c=>io.observe(c));
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;const c=e.target;io.unobserve(c);const m=view[c.dataset.i];
  let el;
  if(m.type==="photo"){el=document.createElement("img");el.decoding="async";el.onload=()=>{el.classList.add("ld");c.classList.add("ok")};el.src=m.thumb_url}
  else{el=document.createElement("video");el.muted=true;el.preload="metadata";el.playsInline=true;el.onloadeddata=()=>{el.classList.add("ld");c.classList.add("ok")};el.src=m.file_url+"#t=0.5";
    c.onmouseenter=()=>{el.currentTime=0;el.play().catch(()=>{})};c.onmouseleave=()=>{el.pause();el.currentTime=.5}}
  el.onerror=()=>c.classList.add("ok");
  c.prepend(el);
}),{rootMargin:"500px"});
function card(m,i){
  const d=document.createElement("div");d.className="card";d.dataset.i=i;
  d.innerHTML=(m.type==="video"?'<div class="badge">&#9654; '+Math.max(1,Math.round(m.duration_ms/1000))+' s</div>':'')+'<div class="cap"><span>'+(m.game_id||m.name)+'</span><small>'+fmtSize(m.size)+'</small></div>';
  d.onclick=()=>show(i);return d;
}
function show(i){
  if(i<0||i>=view.length)return;cur=i;const m=view[i],b=$("box");b.innerHTML="";
  let e;if(m.type==="photo"){e=document.createElement("img");e.src=m.file_url}
  else{e=document.createElement("video");e.src=m.file_url;e.controls=true;e.autoplay=true;e.playsInline=true}
  b.appendChild(e);
  $("lt").textContent=(m.game_id||"")+(m.game_id?" · ":"")+m.name;
  $("ls").textContent=[when(m.captured_at),fmtSize(m.size),m.type==="video"?Math.round(m.duration_ms/1000)+" s":"",(i+1)+" / "+view.length].filter(Boolean).join(" · ");
  $("ld").href=m.file_url;$("ld").download=m.name;$("lb").classList.add("on");document.body.style.overflow="hidden";
}
function hide(){$("box").innerHTML="";$("lb").classList.remove("on");document.body.style.overflow=""}
$("lbx").onclick=hide;$("lp").onclick=()=>show(cur-1);$("ln").onclick=()=>show(cur+1);
$("lb").onclick=e=>{if(e.target.id==="stage")hide()};
document.onkeydown=e=>{if(!$("lb").classList.contains("on"))return;if(e.key==="Escape")hide();if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)};
let tx=0;$("stage").ontouchstart=e=>tx=e.touches[0].clientX;$("stage").ontouchend=e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)show(cur+(d<0?1:-1))};
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;type=b.dataset.t;game="";[...$("seg").children].forEach(x=>x.classList.toggle("on",x===b));render()};
$("chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;game=c.dataset.g;render()};
$("sort").onchange=render;
$("rescan").onclick=async()=>{toast("Scan en cours...");try{await fetch("/api/v1/rescan",{method:"POST"});await loadAll();toast("Bibliothèque mise à jour")}catch(e){toast("Erreur de scan")}};
loadAll().catch(()=>{$("main").innerHTML='<div class="empty"><h2>Erreur</h2>API injoignable.</div>'});
</script></body></html>
